# Mosquitto MQTT Broker — deviceTracking

# MQTT over TCP (backend NestJS client)
listener 1883
protocol mqtt

# MQTT over WebSocket (mobile Expo client, browsers)
listener 9001
protocol websockets

# Dev mode — no auth. Lock down + add users before deploying to prod.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
